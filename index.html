    <script>
      // Mitigation for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when a library tries to polyfill fetch in a restricted environment.
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get() { return originalFetch; },
              set() { /* Ignore attempts to overwrite fetch */ },
              configurable: true
            });
          }
        } catch (e) {
          // If we can't redefine it, it might already be restricted, which is fine as long as it's there.
        }
      })();

      // PWA Service Worker Registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('[PWA] Service Worker registered successfully under scope:', reg.scope);
            })
            .catch(err => {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
