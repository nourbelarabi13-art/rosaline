<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Glow / Accent Shadow for the Shield -->
    <filter id="shield-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4c0519" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Clean background circle for perfect round favicons or transparent integration -->
  <!-- We keeps it transparent for modern elegance, matching browser themes -->
  
  <g filter="url(#shield-shadow)">
    <!-- Shield Outer Border with Elegant Off-White / Light Lavender Pearl Fill -->
    <path d="M 256,140
             C 290,140 380,145 398,180
             C 415,215 415,310 395,370
             C 375,430 310,475 256,488
             C 202,475 137,430 117,370
             C 100,310 100,215 117,180
             C 135,145 222,140 256,140 Z" 
          fill="#FAF8FC" 
          stroke="#4c0519" 
          stroke-width="5" 
          stroke-linejoin="round" />
          
    <!-- Shield Inner Accent Border with Soft Dashed Frame -->
    <path d="M 256,155
             C 285,155 363,160 378,192
             C 392,222 392,305 376,358
             C 358,410 295,453 256,466
             C 217,466 154,410 136,358
             C 120,305 120,222 134,192
             C 149,160 227,155 256,155 Z" 
          fill="none"
          stroke="#4c0519" 
          stroke-width="1.75" 
          stroke-dasharray="6,4" 
          opacity="0.65" />
  </g>

  <!-- Botanical Lavender & Wild Rose Sketch in the Background (Very Soft Lavender) -->
  <g stroke="#c084fc" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central Stems -->
    <path d="M 256,420 C 256,380 256,300 256,210" />
    <path d="M 256,420 C 240,380 215,310 205,230" />
    <path d="M 256,420 C 272,380 297,310 307,230" />
    
    <!-- Lavender Buds - Central Stalk -->
    <circle cx="256" cy="220" r="5" fill="#e9d5ff" stroke="none" />
    <circle cx="251" cy="235" r="4.5" fill="#e9d5ff" stroke="none" />
    <circle cx="261" cy="235" r="4.5" fill="#e9d5ff" stroke="none" />
    <circle cx="256" cy="250" r="5" fill="#e9d5ff" stroke="none" />
    <circle cx="250" cy="265" r="4.5" fill="#e9d5ff" stroke="none" />
    <circle cx="262" cy="265" r="4.5" fill="#e9d5ff" stroke="none" />
    <circle cx="256" cy="280" r="5.5" fill="#e9d5ff" stroke="none" />
    
    <!-- Lavender Buds - Left Stalk -->
    <circle cx="203" cy="245" r="4.5" fill="#e9d5ff" stroke="none" />
    <circle cx="209" cy="260" r="4" fill="#e9d5ff" stroke="none" />
    <circle cx="199" cy="260" r="4" fill="#e9d5ff" stroke="none" />
    <circle cx="207" cy="275" r="4.5" fill="#e9d5ff" stroke="none" />
    
    <!-- Lavender Buds - Right Stalk -->
    <circle cx="309" cy="245" r="4.5" fill="#e9d5ff" stroke="none" />
    <circle cx="303" cy="260" r="4" fill="#e9d5ff" stroke="none" />
    <circle cx="313" cy="260" r="4" fill="#e9d5ff" stroke="none" />
    <circle cx="305" cy="275" r="4.5" fill="#e9d5ff" stroke="none" />

    <!-- Delicate Botanical Leaves and Swirls in background -->
    <path d="M 256,370 C 230,350 210,310 200,290" />
    <path d="M 256,370 C 282,350 302,310 312,290" />
    <path d="M 256,390 C 235,380 220,360 215,340" />
    <path d="M 256,390 C 277,380 292,360 297,340" />
  </g>

  <!-- Typography Layer (Symmetry / Crisp Sharpness) -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <!-- Big Serif letters "RB" -->
    <text x="256" y="315" font-weight="bold" font-size="105" fill="#4c0519" letter-spacing="-1">RB</text>
    
    <!-- Spaced out small identifier "NOUR" -->
    <text x="258" y="365" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#4c0519" letter-spacing="0.25em">NOUR</text>
  </g>

  <!-- Gorgeous Flowing Ribbon & Bow at the Top Rim (Styled precisely like the Logo image) -->
  <g stroke="#4c0519" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bow Loops Layering -->
    <!-- Outer Bow Loops -->
    <path d="M 256,125 C 210,50 130,70 160,130 C 180,170 235,145 256,125" />
    <path d="M 256,125 C 302,50 382,70 352,130 C 332,170 277,145 256,125" />
    <!-- Inner Bow Loops -->
    <path d="M 256,125 C 230,80 180,90 195,130 C 205,150 240,135 256,125" />
    <path d="M 256,125 C 282,80 332,90 317,130 C 307,150 272,135 256,125" />
    
    <!-- Central Knot -->
    <rect x="244" y="112" width="24" height="24" rx="12" fill="#4c0519" stroke="none" />
    
    <!-- Large Scenic Swirling Ribbon Side Tails (Symmetrical Loops) -->
    <!-- Left Ribbon Swirl -->
    <path d="M 244,124 
             C 180,95 110,130 60,180
             C 25,215 10,265 25,310
             C 35,340 55,360 70,335
             C 80,315 75,280 60,250
             C 40,210 80,170 125,165" />
             
    <!-- Right Ribbon Swirl -->
    <path d="M 268,124 
             C 332,95 402,130 452,180
             C 487,215 502,265 487,310
             C 477,340 457,360 442,335
             C 432,315 437,280 452,250
             C 472,210 432,170 387,165" />
  </g>
</svg>
